[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-doctor"
version = "0.1.0"
description = "Context hygiene, payload pruning, and crash recovery toolkit for Google Antigravity."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Antigravity Community" }]
keywords = ["antigravity", "gemini", "ai-agent", "context-compaction", "debugger"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Debuggers",
]

[project.scripts]
agydoc = "agy_doctor.cli:main"
antigravity-doctor = "agy_doctor.cli:main"
